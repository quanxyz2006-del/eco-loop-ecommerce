name: eco-loop

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Run scripts/init-docker.ps1 first}
      MYSQL_USER: ${MYSQL_USER:?Run scripts/init-docker.ps1 first}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/init-docker.ps1 first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/init-docker.ps1 first}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - type: bind
        source: D:/CodexData/eco-loop/mysql
        target: /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}?charset=utf8mb4"
      SECRET_KEY: ${SECRET_KEY:?Run scripts/init-docker.ps1 first}
      ENVIRONMENT: production
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-quanxyz2006@gmail.com}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: D:/CodexData/eco-loop/caddy/data
        target: /data
      - type: bind
        source: D:/CodexData/eco-loop/caddy/config
        target: /config
    depends_on:
      app:
        condition: service_healthy
