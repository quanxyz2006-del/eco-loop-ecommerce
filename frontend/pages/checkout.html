<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thanh toán — ECO-LOOP</title><link rel="stylesheet" href="/assets/css/site.css"><script defer src="/assets/js/common.js"></script><script defer src="/assets/js/checkout.js"></script></head>
<body><header class="site-header" data-site-header></header><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="/">Trang chủ</a> / <a href="/cart.html">Giỏ hàng</a> / Thanh toán</div><span class="eyebrow">Almost yours</span><h1 class="display">Hoàn tất đơn hàng</h1></div></section><section class="section-sm"><div class="container cart-layout"><form id="checkout-form" class="form-card"><h2 class="title" style="font-size:30px">Thông tin nhận hàng</h2><div class="form-grid"><div class="field"><label for="full_name">Họ và tên *</label><input id="full_name" name="full_name" required minlength="2" autocomplete="name"></div><div class="field"><label for="phone">Số điện thoại *</label><input id="phone" name="phone" required minlength="8" autocomplete="tel"></div><div class="field span-2"><label for="shipping_address">Địa chỉ giao hàng *</label><textarea id="shipping_address" name="shipping_address" required minlength="8" autocomplete="street-address"></textarea></div><div class="field"><label for="payment_method">Thanh toán</label><select id="payment_method" name="payment_method"><option value="cod">Thanh toán khi nhận hàng (COD)</option><option value="bank_transfer">Chuyển khoản</option></select></div><div class="field"><label for="note">Ghi chú</label><input id="note" name="note" placeholder="Không bắt buộc"></div></div><div id="checkout-feedback"></div><button class="button" type="submit">Xác nhận đặt hàng</button></form><aside class="cart-summary" id="checkout-summary"></aside></div></section></main><div data-site-footer></div></body></html>
