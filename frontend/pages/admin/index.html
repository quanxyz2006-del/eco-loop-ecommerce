<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Quản trị ECO-LOOP</title><link rel="stylesheet" href="/assets/css/site.css"><script defer src="/assets/js/common.js"></script><script defer src="/assets/js/admin.js"></script><style>
body{background:#f1f3ee}.admin-shell{min-height:100vh}.admin-top{background:var(--forest-deep);color:white;padding:16px 26px;display:flex;align-items:center;justify-content:space-between}.admin-top .brand{color:white}.admin-top p{font-size:11px;color:#c3d1c6;margin:0}.admin-wrap{width:min(1320px,calc(100% - 36px));margin:28px auto}.admin-login{max-width:450px;margin:8vh auto}.admin-layout{display:grid;grid-template-columns:210px 1fr;gap:22px}.admin-nav{display:grid;gap:7px;align-content:start}.admin-nav button{border:0;border-radius:11px;text-align:left;padding:12px 14px;background:transparent;color:#526359;font-weight:600}.admin-nav button.active,.admin-nav button:hover{background:var(--forest);color:white}.admin-panel{min-width:0}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:17px}.metric span{font-size:11px;color:var(--muted)}.metric strong{display:block;font:600 27px 'Playfair Display',serif;color:var(--forest)}.admin-table-wrap{overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:18px}.admin-table{width:100%;border-collapse:collapse;min-width:700px}.admin-table th,.admin-table td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.admin-table th{color:var(--muted);background:#f8f8f3}.admin-heading{display:flex;align-items:center;justify-content:space-between;margin:10px 0 18px}.admin-heading h1{font:600 30px 'Playfair Display',serif;margin:0}.status-pill{display:inline-flex;border-radius:99px;padding:4px 9px;background:#edf1e7;color:var(--forest);font-size:10px}.admin-error{max-width:450px;margin:25px auto}.admin-actions{display:flex;gap:7px;flex-wrap:wrap}.@media(max-width:800px){.admin-layout{grid-template-columns:1fr}.admin-nav{display:flex;overflow:auto}.admin-nav button{white-space:nowrap}.metric-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="admin-shell"><header class="admin-top"><a href="/" class="brand">ECO-LOOP<small style="color:#c5d7bb">ADMIN CONSOLE</small></a><div><p>Quản lý cửa hàng tuần hoàn</p></div><button id="logout" class="button button-small" style="background:transparent;border-color:#ffffff77">Đăng xuất</button></header><main class="admin-wrap"><section id="admin-login" class="surface admin-login"><span class="eyebrow">Secure access</span><h1 class="title" style="font-size:32px">Đăng nhập quản trị</h1><form id="admin-login-form"><div class="field"><label for="email">Email quản trị</label><input id="email" name="email" type="email" required autocomplete="username"></div><div class="field"><label for="password">Mật khẩu</label><input id="password" name="password" type="password" required autocomplete="current-password"></div><div id="login-feedback"></div><button class="button" type="submit" style="width:100%">Đăng nhập</button></form></section><section id="admin-app" hidden><div class="admin-layout"><nav class="admin-nav"><button class="active" data-tab="overview">Tổng quan</button><button data-tab="products">Sản phẩm</button><button data-tab="orders">Đơn hàng</button><button data-tab="trade-ins">Thu gom</button><button data-tab="articles">Bài viết</button><button data-tab="contacts">Liên hệ</button></nav><div class="admin-panel" id="admin-panel"></div></div></section></main></div></body></html>
