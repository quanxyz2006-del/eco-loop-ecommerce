<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Khám phá bộ sưu tập thời trang ECO-LOOP."><title>Sản phẩm — ECO-LOOP</title><link rel="stylesheet" href="/assets/css/site.css"><script defer src="/assets/js/common.js"></script><script defer src="/assets/js/catalog.js"></script></head>
<body data-page="products"><header class="site-header" data-site-header></header><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="/">Trang chủ</a> / Bộ sưu tập</div><span class="eyebrow">Mindful wardrobe</span><h1 class="display">Mặc điều mình tin.</h1><p class="lead">Những thiết kế tối giản, dễ kết hợp và được giới thiệu cùng thông tin vật liệu minh bạch.</p></div></section>
<section class="section-sm"><div class="container catalog-layout"><aside class="filters"><h3>Lọc sản phẩm</h3><form id="filter-form"><div class="field"><label for="search">Tìm sản phẩm</label><input id="search" name="search" placeholder="Áo thun, túi tote..."></div><div class="field"><label for="category">Danh mục</label><select id="category" name="category_id"><option value="">Tất cả danh mục</option></select></div><div class="field"><label>Khoảng giá (₫)</label><div class="filter-row"><input type="number" name="min_price" min="0" placeholder="Từ"><input type="number" name="max_price" min="0" placeholder="Đến"></div></div><div class="field"><label for="material">Chất liệu</label><input id="material" name="material_eco_type" placeholder="Ví dụ: cotton"></div><button class="button" type="submit" style="width:100%">Áp dụng bộ lọc</button><button class="button button-light button-small" id="clear-filters" type="button" style="width:100%;margin-top:9px">Xóa bộ lọc</button></form><p class="muted" style="font-size:10px;margin-top:18px">Thông tin chất liệu và chỉ số tác động trong bản demo chỉ mang tính minh họa.</p></aside><div><div class="catalog-toolbar"><span id="result-count">Đang tải sản phẩm…</span><select id="sort" aria-label="Sắp xếp"><option value="newest">Mới nhất</option><option value="price-low">Giá thấp đến cao</option><option value="price-high">Giá cao đến thấp</option></select></div><div id="product-grid" class="product-grid"></div><div id="catalog-message"></div></div></div></section></main><div data-site-footer></div></body></html>
